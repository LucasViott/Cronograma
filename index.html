<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronoplano · Equipe</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDx3FgH2_rSTyQ561q4bjE8TZUJ_FGhJl8",
    authDomain: "cronoplano.firebaseapp.com",
    projectId: "cronoplano",
    storageBucket: "cronoplano.firebasestorage.app",
    messagingSenderId: "162271814959",
    appId: "1:162271814959:web:eaea9db17a2c216fb0adda",
    measurementId: "G-34H054MQEH"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const dataDocRef = doc(db, 'cronoplano', 'data');

    window.firebaseBridge = {
      ready: true,
      async load() {
        const snap = await getDoc(dataDocRef);
        return snap.exists() ? snap.data() : null;
      },
      async save(payload) {
        // Safe merge with remote before writing to prevent overwrites
        let remote = null;
        try {
          const snap = await getDoc(dataDocRef);
          if (snap.exists()) remote = snap.data();
        } catch (e) {}
        const merged = remote && window.mergeAppData ? window.mergeAppData(payload, remote) : payload;
        await setDoc(dataDocRef, { ...merged, updatedAt: serverTimestamp() }, { merge: true });
        return merged;
      },
      onSnapshot(cb, errCb) {
        return onSnapshot(dataDocRef, snap => {
          if (snap.exists()) cb(snap.data());
        }, err => {
          if (errCb) errCb(err);
        });
      }
    };
    window.firebaseReady = true;
    window.dispatchEvent(new CustomEvent('firebase-ready'));
  } catch (err) {
    console.error('[Firebase] erro:', err);
    window.firebaseBridge = null;
    window.firebaseReady = true;
    window.dispatchEvent(new CustomEvent('firebase-ready'));
  }
</script>
<style>
:root{
  color-scheme: dark;
  --bg:#0a0a0a;--bg-2:#0f0f0f;--surface:#151515;--surface-2:#1c1c1c;
  --border:#282828;--border-soft:#1a1a1a;--text:#f0f0f0;--muted:#7a7a7a;
  --accent:#1e40af;--accent-2:#1e3a8a;--danger:#2563eb;--radius:14px;
  --overlay:rgba(255,255,255,.018);--overlay-2:rgba(255,255,255,.024);--overlay-3:rgba(255,255,255,.03);
  --topbar-bg:rgba(10,10,10,.85);--backdrop:rgba(4,4,4,.8);
  --body-glow-1:rgba(30,64,175,.14);--body-glow-2:rgba(255,255,255,.02);
  --shadow-modal:0 26px 80px rgba(0,0,0,.75);
  --shadow-login:0 30px 80px rgba(0,0,0,.7);
  --shadow-menu:0 14px 40px rgba(0,0,0,.55);
  --readonly-bg:linear-gradient(90deg, rgba(163,163,163,.08), transparent);
  --readonly-border:rgba(163,163,163,.2);--readonly-accent:#a3a3a3;
  --done-check:linear-gradient(135deg,#e5e5e5,#8a8a8a);--done-check-color:#0a0a0a;
  --holiday-bg:linear-gradient(180deg, rgba(30,64,175,.22), transparent);
  --holiday-border:rgba(59,130,246,.55);--holiday-num:#bfdbfe;
}
[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f4f5;--bg-2:#ebebed;--surface:#ffffff;--surface-2:#f3f3f5;
  --border:#d4d4d8;--border-soft:#e4e4e7;--text:#18181b;--muted:#71717a;
  --accent:#1e40af;--accent-2:#1e3a8a;--danger:#1d4ed8;
  --overlay:rgba(0,0,0,.012);--overlay-2:rgba(0,0,0,.018);--overlay-3:rgba(0,0,0,.022);
  --topbar-bg:rgba(255,255,255,.88);--backdrop:rgba(0,0,0,.35);
  --body-glow-1:rgba(30,64,175,.08);--body-glow-2:rgba(0,0,0,.015);
  --shadow-modal:0 26px 80px rgba(0,0,0,.18);
  --shadow-login:0 30px 80px rgba(0,0,0,.15);
  --shadow-menu:0 14px 40px rgba(0,0,0,.15);
  --readonly-bg:linear-gradient(90deg, rgba(115,115,115,.08), transparent);
  --readonly-border:rgba(115,115,115,.25);--readonly-accent:#71717a;
  --done-check:linear-gradient(135deg,#18181b,#404040);--done-check-color:#ffffff;
  --holiday-bg:linear-gradient(180deg, rgba(30,64,175,.12), transparent);
  --holiday-border:rgba(30,64,175,.45);--holiday-num:#1e3a8a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background-color .22s ease, color .22s ease;}
[hidden]{display:none !important;}
.sync-indicator{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7a7a7a;margin-left:8px;vertical-align:middle;flex:0 0 auto;}
.sync-indicator.ok{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.6);}
.sync-indicator.syncing{background:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.6);animation:syncPulse 1s infinite;}
.sync-indicator.offline{background:#7a7a7a;}
.sync-indicator.error{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.6);}
@keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.login-screen{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:var(--bg);}
.login-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:34px 30px 26px;box-shadow:var(--shadow-login);}
.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
.login-brand .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:22px;color:#fff;}
.login-brand h1{margin:0;font-size:21px;}
.login-brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}
.login-card .field{margin-bottom:16px;display:block;}
.login-card .field > span{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:7px;}
.login-card input{font-size:15px;padding:12px 14px;}
.login-btn{width:100%;padding:12px 20px;font-size:14px;margin-top:4px;}
.login-link-btn{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:8px;margin-top:8px;width:100%;text-align:center;}
.login-link-btn.forgot{color:#93c5fd;font-weight:600;}
.login-error{background:rgba(30,64,175,.14);border:1px solid rgba(30,64,175,.35);color:#93c5fd;border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:14px;}
.login-user-badge{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:18px;}
.login-user-badge .avatar{width:34px;height:34px;border-radius:9px;}
.login-footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--border-soft);display:flex;justify-content:center;gap:8px;}
.login-footer .chip{font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:5px 12px;border-radius:20px;}
.login-hint{margin-top:12px;text-align:center;font-size:11px;color:var(--muted);}
.topbar{position:sticky;top:0;z-index:60;background:var(--topbar-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-soft);}
.topbar-inner{max-width:1400px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;}
.brand small{display:block;font-size:10.5px;color:var(--muted);}
.topbar-carteiras{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;}
.carteira-chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(30,64,175,.16);color:#93c5fd;border:1px solid rgba(30,64,175,.4);text-transform:uppercase;}
.carteira-chip.all-members{background:rgba(30,64,175,.22);color:#bfdbfe;}
.tabs{display:flex;gap:5px;margin-left:auto;background:var(--surface);padding:5px;border-radius:13px;border:1px solid var(--border);}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);padding:8px 15px;border-radius:9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}
.user-wrap{display:flex;align-items:center;gap:8px;}
.user-chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;padding:6px 11px 6px 7px;display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:600;}
.avatar{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;background-size:cover;background-position:center;}
.role-badge{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;}
.role-badge.leader{background:rgba(30,64,175,.22);color:#93c5fd;}
.role-badge.member{background:rgba(255,255,255,.07);color:#c0c0c0;}
.icon-chip-btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:10px;height:32px;padding:0 11px;cursor:pointer;font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:5px;}
.icon-chip-btn.icon-only{width:32px;padding:0;justify-content:center;}
.save-btn{background:linear-gradient(135deg, rgba(16,185,129,.16), rgba(5,150,105,.08));border-color:rgba(16,185,129,.4);color:#6ee7b7;font-weight:700;}
.save-btn.dirty{animation:savePulse 2s infinite;background:rgba(16,185,129,.25);border-color:#10b981;}
@keyframes savePulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5);}50%{box-shadow:0 0 0 6px rgba(16,185,129,0);}}
.settings-wrap{position:relative;}
.settings-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:230px;box-shadow:var(--shadow-menu);z-index:120;}
.settings-title{font-size:10.5px;font-weight:800;color:var(--muted);padding:8px 10px 6px;text-transform:uppercase;}
.settings-item{appearance:none;width:100%;background:transparent;border:0;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--text);font:inherit;font-size:13px;cursor:pointer;text-align:left;}
.settings-item:hover{background:var(--surface-2);}
.settings-item.danger{color:#93c5fd;}
.settings-divider{height:1px;background:var(--border-soft);margin:5px 4px;}
main{max-width:1400px;margin:0 auto;padding:26px 22px 90px;}
.view{display:none;}
.view.active{display:block;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;}
.section-head h2{margin:0;font-size:23px;}
.section-head p{margin:5px 0 0;color:var(--muted);font-size:13.5px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.panel-head h3{margin:0;font-size:15.5px;}
input,select,textarea{width:100%;background:var(--bg-2);border:1.5px solid var(--border);color:var(--text);border-radius:11px;padding:11px 13px;font:inherit;font-size:14px;outline:none;}
textarea{resize:vertical;min-height:60px;}
.field{display:block;margin-bottom:14px;}
.field > span{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn{appearance:none;border:1px solid transparent;border-radius:10px;font:inherit;font-size:13.5px;font-weight:600;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}
.btn.ghost{background:var(--surface-2);color:var(--text);border-color:var(--border);}
.quick-add{display:grid;grid-template-columns:108px 108px 1fr 1fr auto;grid-template-areas:"start end cat car btn" "title title title title title";gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
.quick-add #qTime{grid-area:start;}
.quick-add #qEnd{grid-area:end;}
.quick-add #qCat{grid-area:cat;}
.quick-add #qCarteira{grid-area:car;}
.quick-add button{grid-area:btn;}
.quick-add #qTitle{grid-area:title;min-height:80px;}
.date-nav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:18px;}
.date-nav .nav-btn{width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);cursor:pointer;}
.date-nav input[type=date]{width:auto;padding:10px 12px;}
.date-nav .spacer{margin-left:auto;}
.filter-wrap{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1.5px solid var(--border);border-radius:11px;padding:0 12px;height:44px;}
.filter-select{background:transparent;border:0;color:var(--text);font-weight:700;}
.daily-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;}
.task-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
.task{display:grid;grid-template-columns:auto 92px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--c,var(--accent));border-radius:12px;padding:13px 15px;}
.task.done{opacity:.5;}
.task.done .t-title{text-decoration:line-through;}
.check{width:23px;height:23px;border-radius:50%;border:2px solid #3d3d3d;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;}
.task.done .check{background:var(--done-check);border-color:transparent;color:var(--done-check-color);}
.pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:color-mix(in srgb, var(--c) 16%, transparent);color:var(--c);border:1px solid color-mix(in srgb, var(--c) 32%, transparent);text-transform:uppercase;}
.pill.carteira{background:rgba(30,64,175,.16);color:#93c5fd;}
.t-actions{display:flex;gap:4px;}
.t-actions button{width:31px;height:31px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;}
.t-actions button:hover{background:var(--surface-2);color:var(--text);}
.empty{text-align:center;padding:46px 20px;color:var(--muted);border:1.5px dashed var(--border);border-radius:var(--radius);}
.cal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.cal-cell{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:11px;padding:8px;min-height:50px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.selected{background:rgba(30,64,175,.2);border-color:var(--accent);}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:11px;}
.day-col{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px;min-height:190px;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.month-day{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:11px;padding:7px;min-height:120px;cursor:pointer;}
.month-day.today{border-color:var(--accent);}
.modal-backdrop{position:fixed;inset:0;z-index:200;background:var(--backdrop);backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px;}
.modal{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);cursor:pointer;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.members-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;}
.member-card{background:var(--bg-2);border:1px solid var(--border-soft);border-left:3px solid var(--c);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:10px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:18px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat-card .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;font-weight:700;}
.stat-card .v{font-size:29px;font-weight:800;margin-top:7px;}
.stat-card .s{font-size:11.5px;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>
<!-- Login -->
<div class="login-screen" id="loginScreen" hidden>
  <div class="login-card">
    <div class="login-brand"><div class="logo">◈</div><div><h1>Cronoplano</h1><p id="loginSubtitle">Acesse com seu nome</p></div></div>
    <form id="loginForm" autocomplete="off">
      <div id="loginStepName">
        <label class="field"><span>Nome e sobrenome</span><input type="text" id="loginName" placeholder="Ex: Lucas Viotti" required></label>
        <div class="login-error" id="loginError" hidden></div>
        <button type="submit" class="btn primary login-btn">Continuar →</button>
      </div>
      <div id="loginStepPwd" hidden>
        <div class="login-user-badge"><div class="avatar" id="loginPwdAvatar">?</div><div class="info"><div class="nm" id="loginPwdName">—</div></div></div>
        <label class="field"><span>Senha</span><input type="password" id="loginPwd" placeholder="••••••••"></label>
        <div class="login-error" id="loginError2" hidden></div>
        <button type="submit" class="btn primary login-btn">Entrar →</button>
        <button type="button" class="login-link-btn" id="loginBack2">← Voltar</button>
      </div>
      <div id="loginStepSetup" hidden>
        <label class="field"><span>Nova senha</span><input type="password" id="loginPwdNew" placeholder="Mínimo 4 caracteres"></label>
        <label class="field"><span>Confirme a senha</span><input type="password" id="loginPwdNew2"></label>
        <div class="login-error" id="loginError3" hidden></div>
        <button type="submit" class="btn primary login-btn">Definir senha e entrar →</button>
      </div>
    </form>
  </div>
</div>

<header class="topbar" id="appTopbar" hidden>
  <div class="topbar-inner">
    <div class="brand"><div class="logo">◈</div><div>Cronoplano<small>equipe &amp; rotina</small></div><span class="sync-indicator offline" id="syncIndicator"></span></div>
    <div class="topbar-carteiras" id="topbarCarteiras"></div>
    <nav class="tabs" id="tabsNav">
      <button class="tab active" data-tab="daily">☀️ Diário</button>
      <button class="tab" data-tab="weekly">🗓️ Semanal</button>
      <button class="tab" data-tab="month">📆 Mês</button>
      <button class="tab" data-tab="dashboard">📊 Painel</button>
      <button class="tab" data-tab="team" data-leader-only hidden>👥 Equipe</button>
    </nav>
    <div class="user-wrap">
      <button class="icon-chip-btn save-btn" id="saveBtn"><span class="ico">💾</span><span id="saveBtnLabel">Salvar</span></button>
      <button class="user-chip" id="userChip"><span class="avatar" id="userChipAvatar">?</span><span id="userChipName">—</span><span class="role-badge member" id="userChipRole">membro</span></button>
      <div class="settings-wrap">
        <button class="icon-chip-btn icon-only" id="settingsBtn">⚙️</button>
        <div class="settings-menu" id="settingsMenu" hidden>
          <div class="settings-title">Configurações</div>
          <button type="button" class="settings-item" id="setImport">📥 Importar cronograma</button>
          <button type="button" class="settings-item" id="setExport" data-leader-only hidden>📊 Exportar cronogramas</button>
          <button type="button" class="settings-item" id="setTheme">☀️ Alternar tema</button>
          <div class="settings-divider"></div>
          <button type="button" class="settings-item danger" id="setLogout">🚪 Sair</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="appMain" hidden>
  <section class="view active" id="view-daily">
    <div class="daily-layout">
      <div class="daily-main">
        <div class="date-nav">
          <button class="nav-btn" id="prevDay">‹</button>
          <input type="date" id="dailyDate">
          <button class="nav-btn" id="nextDay">›</button>
          <div class="spacer"></div>
          <button class="btn ghost" id="todayBtn">Hoje</button>
        </div>
        <form class="quick-add" id="dailyForm">
          <input type="time" id="qTime" required>
          <input type="time" id="qEnd">
          <select id="qCat"></select>
          <select id="qCarteira"></select>
          <button class="btn primary" type="submit">+ Adicionar</button>
          <textarea id="qTitle" placeholder="Descreva a atividade..." required></textarea>
        </form>
        <ul class="task-list" id="dailyList"></ul>
      </div>
      <aside class="daily-side"><div class="panel"><div class="cal-grid" id="calGrid"></div></div></aside>
    </div>
  </section>
  <section class="view" id="view-weekly"><div class="panel"><div class="week-grid" id="weekGrid"></div></div></section>
  <section class="view" id="view-month"><div class="panel"><div class="month-grid" id="monthGrid"></div></div></section>
  <section class="view" id="view-dashboard"><div id="dashContent"></div></section>
  <section class="view" id="view-team"><div id="teamOverviewWrap"></div></section>
</main>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal">
    <div class="modal-head"><h3>Atividade</h3><button class="icon-btn" id="modalClose">✕</button></div>
    <form id="modalForm">
      <label class="field"><span>Título</span><input type="text" id="fTitle" required></label>
      <label class="field"><span>Data</span><input type="date" id="fDate"></label>
      <div class="row">
        <label class="field"><span>Início</span><input type="time" id="fStart"></label>
        <label class="field"><span>Fim</span><input type="time" id="fEnd"></label>
      </div>
      <div class="modal-actions"><button type="button" class="btn ghost" id="btnCancel">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="appDialog" hidden>
  <div class="modal" style="max-width:400px;">
    <h3 id="appDialogTitle">Aviso</h3>
    <p id="appDialogMessage" style="font-size:14px;line-height:1.5;"></p>
    <div class="modal-actions"><button type="button" class="btn primary" id="appDialogOk">OK</button></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
